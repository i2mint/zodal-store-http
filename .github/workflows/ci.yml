name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  publish:
    name: Publish
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (contains(github.event.head_commit.message, '[publish]') ||
       contains(github.event.head_commit.message, '[force publish]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          FORCE=""
          if [[ "${{ github.event.head_commit.message }}" == *"[force publish]"* ]]; then
            FORCE="--no-git-checks"
          fi
          # No `|| true`. An expired NPM_TOKEN makes the registry answer 404 to the PUT,
          # and swallowing that exit code reports the run green while npm keeps serving
          # the old version. See i2mint/zodal#8 — that mask cost a whole debugging cycle.
          pnpm publish --access public $FORCE

      # A publish is only real if the registry serves it. Ask the registry — but give it a
      # moment: a brand-new package takes ~40s to become readable, so a single immediate
      # check false-negatives on every first publish (it did, on this package's own first
      # release). Retry, then fail for real.
      - name: Verify the registry serves this version
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          for attempt in $(seq 1 10); do
            got=$(npm view "@zodal/store-http@${VERSION}" version 2>/dev/null || true)
            if [ "$got" = "$VERSION" ]; then
              echo "@zodal/store-http@${VERSION} confirmed on the registry (attempt ${attempt})"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}/10) — waiting for propagation"
            sleep 15
          done
          echo "::error::@zodal/store-http@${VERSION} never appeared on the registry — the publish failed."
          exit 1

      - name: Configure SSH for git push
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: Tag release
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}" || echo "Tag v${VERSION} already exists"
          git push origin "v${VERSION}" || echo "Tag already pushed"
